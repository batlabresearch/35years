<title>서른다섯 해</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* 모시 조각보 위의 한 줄: 가운데 좁은 단 하나, 솔기(점선)는 조각보·편지·메아리에만 쓴다 */
:root{
  --bg:#e9ece7; --paper:#fafaf6; --paper2:#f0f2ed; --ink:#1f2b3d; --ink2:#566273; --ink3:#8a94a1;
  --line:#d3d8d1; --seam:#a7b0a6; --accent:#2c4a7e; --on-accent:#ffffff; --accent-soft:#dfe6f2;
  --joy:#e8b844; --warm:#e68aa3; --sad:#8f959d; --upset:#74bde9;
  --good:#2f7d5c; --bad:#b9503a; --seed:#3f7d52; --seed-soft:#dcebdf; --photo:#ffffff; --shade:rgba(31,43,61,.12);
  --tint-k:#f8f1e1; --tint-k-line:#e2d3b0; --tint-m:#e8eef7; --tint-m-line:#bfcde4; --tint-c:#edf1e8; --tint-c-line:#b4c0ae; --sepia:#f0e7d4; --seed-ink:#1f5a36;
  --joy-p:#f6eacb; --warm-p:#f5dfe2; --sad-p:#e0e2e1; --upset-p:#daebf3;
  --f-body:"Gowun Dodum","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-voice:"Gowun Batang","Nanum Myeongjo","Batang",serif;
  --f-kid:"Gaegu","Gowun Dodum","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151c; --paper:#1a202a; --paper2:#232b37; --ink:#e7e9ee; --ink2:#a9b2be; --ink3:#77818e;
    --line:#2f3743; --seam:#4a5465; --accent:#93b3ea; --on-accent:#0e1622; --accent-soft:#243149;
    --joy:#d6a93c; --warm:#d47d96; --sad:#7d848d; --upset:#62acd9;
    --good:#6dc09a; --bad:#e58a72; --seed:#7fbd8f; --seed-soft:#1f3327; --photo:#ece9e2; --shade:rgba(0,0,0,.4);
    --joy-p:#47412e; --warm-p:#473644; --sad-p:#323842; --upset-p:#2b4254; --tint-k:#2c2a22; --tint-k-line:#4f4935; --tint-m:#212b3b; --tint-m-line:#3d4d6a; --tint-c:#232b31; --tint-c-line:#4c5867; --sepia:#2b2720; --seed-ink:#9fd6ae;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11151c; --paper:#1a202a; --paper2:#232b37; --ink:#e7e9ee; --ink2:#a9b2be; --ink3:#77818e;
  --line:#2f3743; --seam:#4a5465; --accent:#93b3ea; --on-accent:#0e1622; --accent-soft:#243149;
  --joy:#d6a93c; --warm:#d47d96; --sad:#7d848d; --upset:#62acd9;
  --good:#6dc09a; --bad:#e58a72; --seed:#7fbd8f; --seed-soft:#1f3327; --photo:#ece9e2; --shade:rgba(0,0,0,.4);
    --joy-p:#47412e; --warm-p:#473644; --sad-p:#323842; --upset-p:#2b4254; --tint-k:#2c2a22; --tint-k-line:#4f4935; --tint-m:#212b3b; --tint-m-line:#3d4d6a; --tint-c:#232b31; --tint-c-line:#4c5867; --sepia:#2b2720; --seed-ink:#9fd6ae;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.65 var(--f-body);-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:break-word}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-appearance:none;appearance:none;border-radius:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--f-voice);font-weight:700;text-wrap:balance;line-height:1.35}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:14px 48px;display:flex;flex-direction:column;gap:12px}

/* 머리 */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.top .age{font-family:var(--f-voice);font-weight:700;font-size:24px;line-height:1.2}
.top .sub{font-size:13px;color:var(--ink2)}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tool{font-size:13px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink2);white-space:nowrap}
.tool:hover{border-color:var(--accent);color:var(--ink)}
.tool.seed{background:var(--seed-soft);border-color:transparent;color:var(--seed)}
.tabs{display:flex;gap:6px}
.tab{font-size:14px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);color:var(--ink2)}
.tab.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* 조각보 */
.strip{display:grid;grid-template-columns:repeat(30,minmax(0,1fr));gap:2px;width:100%;padding:6px;border:1px dashed var(--seam);border-radius:8px;background:var(--paper)}
.strip .pt{height:8px;aspect-ratio:auto;border-radius:1.5px}
.pt{--c1:var(--line);--c2:var(--c1);background:linear-gradient(135deg,var(--c1) 50%,var(--c2) 50%);border-radius:4px;aspect-ratio:1;position:relative;display:block}
.pt.e-joy{--c1:var(--joy)}.pt.e-warm{--c1:var(--warm)}.pt.e-sad{--c1:var(--sad)}.pt.e-upset{--c1:var(--upset)}
.pt.f-joy{--c2:var(--joy)}.pt.f-warm{--c2:var(--warm)}.pt.f-sad{--c2:var(--sad)}.pt.f-upset{--c2:var(--upset)}
.pt.pale.e-joy{--c1:var(--joy-p)}.pt.pale.e-warm{--c1:var(--warm-p)}.pt.pale.e-sad{--c1:var(--sad-p)}.pt.pale.e-upset{--c1:var(--upset-p)}
.pt.pale.f-joy{--c2:var(--joy-p)}.pt.pale.f-warm{--c2:var(--warm-p)}.pt.pale.f-sad{--c2:var(--sad-p)}.pt.pale.f-upset{--c2:var(--upset-p)}
.pt.pale{box-shadow:inset 0 0 0 1px var(--line)}
.pt.empty{background:none;box-shadow:inset 0 0 0 1px var(--line)}
.pt.hid{background:var(--paper2);box-shadow:inset 0 0 0 1px var(--seam)}
.pt.new{animation:sew .7s ease-out}
@keyframes sew{from{transform:scale(2.2) rotate(8deg);opacity:0}to{transform:none;opacity:1}}
.quilt{display:grid;grid-template-columns:auto repeat(12,minmax(0,1fr));gap:4px;align-items:center}
.quilt .rl{font-size:11px;color:var(--ink3);padding-right:6px;white-space:nowrap}
.quilt .pt.ph::after{content:"";position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--paper);box-shadow:0 0 0 1px var(--ink2)}
.quilt .pt.hid::before{content:"?";position:absolute;top:0;right:0;bottom:0;left:0;display:grid;place-items:center;font-size:12px;color:var(--ink3)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* 수치 */
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px}
.meter{font-size:12px;color:var(--ink2);display:flex;flex-direction:column;gap:3px;min-width:0}
.meter b{font-weight:400;color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:var(--ink2);border-radius:3px}
.bar.low span{background:var(--bad)}
.meter.money b{font-size:14px}

/* 아이 */
.stage{position:relative;height:214px;background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ruler{position:absolute;left:0;top:0;bottom:0;width:40px;border-right:1px solid var(--line);background:var(--paper2)}
.ruler u{position:absolute;right:0;height:1px;background:var(--seam);width:8px;text-decoration:none}
.ruler u.b{width:14px}
.ruler em{position:absolute;left:4px;font-size:10px;font-style:normal;color:var(--ink3);transform:translateY(50%)}
.ruler s{position:absolute;right:0;width:22px;height:2px;background:var(--accent);text-decoration:none;opacity:.35}
.ruler s.now{opacity:1;width:40px}
.who{position:absolute;left:40px;right:44%;bottom:12px;display:flex;justify-content:center;align-items:flex-end}
.who svg{display:block;transition:height .8s}
.floor{position:absolute;left:40px;right:0;bottom:11px;height:1px;background:var(--line)}
.bubble{position:absolute;top:12px;right:12px;max-width:42%;background:var(--paper2);border-radius:14px 14px 2px 14px;padding:7px 12px;font-family:var(--f-kid);font-size:19px;line-height:1.3}
.bubble.grown{font-family:var(--f-body);font-size:14px;line-height:1.5}
.kidline{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink2);flex-wrap:wrap}
.kidline b{font-weight:400;color:var(--ink)}

/* 본문 카드 */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h2{font-size:18px}
.panel p{color:var(--ink)}
.eyebrow{font-size:12px;color:var(--ink3);letter-spacing:.04em}
.muted{color:var(--ink2);font-size:14px}
.small{font-size:13px;color:var(--ink2)}
.say{font-family:var(--f-kid);font-size:20px;line-height:1.4}
.say.grown{font-family:var(--f-voice);font-size:16px;line-height:1.7}
.chs{display:flex;flex-direction:column;gap:8px}
.ch{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ch:hover{border-color:var(--accent);background:var(--accent-soft)}
.ch small{color:var(--ink3);font-size:12px;white-space:nowrap}
.ch:disabled{opacity:.5;cursor:default}
.ch:disabled:hover{border-color:var(--line);background:var(--paper)}
.btn{width:100%;background:var(--accent);color:var(--on-accent);border-radius:12px;padding:13px 16px;text-align:center;font-size:16px}
.btn:hover{filter:brightness(1.08)}
.gbtn{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 16px;text-align:center;color:var(--ink2);background:var(--paper)}
.gbtn:hover{border-color:var(--accent);color:var(--ink)}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.act{border:1px solid var(--line);border-radius:12px;padding:9px 11px;display:flex;flex-direction:column;gap:1px;min-width:0;background:var(--paper)}
.act span{font-size:14px;line-height:1.4}
.act small{font-size:12px;color:var(--ink3)}
.act.on{border-color:var(--accent);background:var(--accent-soft)}
.act:disabled{opacity:.45;cursor:default}
.toks{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--ink2)}
.toks i{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--accent);display:inline-block}
.toks i.f{background:var(--accent)}
.dls{display:flex;flex-wrap:wrap;gap:5px}
.dl{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);font-variant-numeric:tabular-nums}
.dl.up{color:var(--good);border-color:currentColor}
.dl.dn{color:var(--bad);border-color:currentColor}
.seedmark{font-size:13px;color:var(--seed);border-top:1px dashed var(--seam);padding-top:10px}
details.fact{font-size:13px;color:var(--ink2);border-top:1px solid var(--line);padding-top:8px}
details.fact summary{cursor:pointer;color:var(--ink3)}
.echo{border:1px dashed var(--seed)}
.echo .then{display:flex;align-items:flex-end;gap:14px;justify-content:center;padding:4px 0}
.echo .then .arrow{color:var(--ink3);padding-bottom:18px}
.echo blockquote{margin:0;font-size:13px;color:var(--ink3)}
.sewn{display:flex;align-items:center;gap:10px}
.sewn .pt{width:34px;flex:none}
.photo{align-self:center;background:var(--photo);color:#2a2a33;padding:9px 9px 8px;box-shadow:0 2px 10px var(--shade);transform:rotate(-1.5deg);width:min(220px,80%);display:flex;flex-direction:column;gap:5px}
.photo .pic{background:#eef0ea;height:120px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.photo .cap{font-family:var(--f-kid);font-size:17px;line-height:1.25;text-align:center}
.photo .cap small{display:block;font-size:13px;color:#777}
.tease{font-size:14px;color:var(--ink2);border-left:2px solid var(--seam);padding-left:10px}
.others{font-size:14px;color:var(--ink2);border-top:1px solid var(--line);padding-top:10px}
.ledger{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.ledger td{padding:4px 0;border-bottom:1px solid var(--line)}
.ledger td:last-child{text-align:right}
.ledger tr.sumr td{border-bottom:0;font-family:var(--f-voice);font-weight:700}

/* 처음 화면, 편지 */
.hero{padding-block:28px 8px;display:flex;flex-direction:column;gap:10px}
.hero h1{font-size:40px;letter-spacing:-.01em}
.hero p{color:var(--ink2)}
.swatch{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;padding:10px;border:1px dashed var(--seam);border-radius:10px;background:var(--paper)}
.field{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--paper);font-size:18px}
.names{display:flex;flex-wrap:wrap;gap:6px}
.names button{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;background:var(--paper)}
.names button:hover{border-color:var(--accent)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
.facts dt{color:var(--ink3)}
.facts dd{margin:0}
.letter{font-family:var(--f-voice);background:var(--paper);border:1px dashed var(--seam);border-radius:6px;padding:22px 20px;line-height:1.95;display:flex;flex-direction:column;gap:14px;font-size:16px}
.letter .sig{text-align:right}
.axes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.axes div{border:1px solid var(--line);border-radius:10px;padding:8px 4px;font-size:13px;color:var(--ink2)}
.axes b{display:block;font-family:var(--f-voice);font-size:16px;color:var(--ink)}
.recap{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.recap li{display:grid;grid-template-columns:64px 1fr;gap:8px}
.recap li span:first-child{color:var(--ink3)}
.hints{display:flex;flex-wrap:wrap;gap:5px}
.hints span{font-size:12px;border:1px dashed var(--seam);border-radius:6px;padding:2px 7px;color:var(--ink3)}

/* 겹쳐 뜨는 것 */
.modal{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(12,16,24,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.sheet{background:var(--paper);border-radius:16px;max-width:460px;width:100%;max-height:88vh;max-height:88dvh;-webkit-overflow-scrolling:touch;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.sheet h2{font-size:19px}
.sheet ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.tip{position:fixed;z-index:80;max-width:250px;background:var(--ink);color:var(--paper);font-size:13px;line-height:1.5;padding:8px 11px;border-radius:8px;pointer-events:none}
[data-tip]{cursor:help}
/* 아이폰은 누를 수 있는 것으로 보이는 요소만 탭을 전달한다 */
@media (hover:none){[data-tip]{cursor:pointer}}
button[data-tip]{cursor:pointer}
.src{font-size:13px;display:flex;flex-direction:column;gap:8px}
.src div b{display:block;font-weight:400;color:var(--ink)}
.src div span{color:var(--ink3)}
@media (max-width:360px){.acts{grid-template-columns:1fr}.hero h1{font-size:34px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* 2차 손질: 누구의 수치인지, 무엇을 고를 수 있는지, 지난 선택이 돌아오는 순간이 잘 보이게 */
.tip{white-space:pre-line;max-width:310px}
.top{flex-wrap:wrap}
.top>div:first-child{flex:none}
.top .age,.top .sub{white-space:nowrap}
.tools{flex:1 1 170px}
.grp{display:flex;flex-direction:column;gap:8px}
.grp-h{display:flex;align-items:baseline;gap:8px;font-size:13px;color:var(--ink2);border-bottom:1px solid var(--line);padding-bottom:4px}
.grp-h b{font-family:var(--f-voice);font-size:15px;color:var(--ink)}
.meter span{white-space:nowrap}
.fx{display:flex;flex-wrap:wrap;gap:5px}
.fx span{font-size:12px;border-radius:6px;padding:3px 8px;border:1px solid currentColor}
.fx span small{font-size:11px}
.fx .good{color:var(--good)}
.fx .bad{color:var(--bad)}
.who{right:0;justify-content:flex-start;padding-left:12%}
.kidwrap{position:relative;display:flex}
.bubble{left:calc(100% + 2px);right:auto;top:-2px;width:max-content;max-width:min(44vw,190px);border-radius:14px 14px 14px 2px;background:var(--accent-soft)}
.slotbox{border:1.5px solid var(--accent);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--accent-soft)}
.slothead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.slothead b{font-family:var(--f-voice);font-size:16px}
.slothead span{font-size:14px}
.slots{display:flex;gap:6px}
.slots i{flex:1;max-width:76px;height:16px;border-radius:5px;border:2px solid var(--accent);background:var(--paper)}
.slots i.f{background:var(--accent)}
.actgrp{font-size:13px;color:var(--ink2);font-weight:700}
.act{border-width:1.5px}
.act.k{background:var(--tint-k);border-color:var(--tint-k-line)}
.act.m{background:var(--tint-m);border-color:var(--tint-m-line)}
.act small{color:var(--ink2)}
.act.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.act.on small{color:var(--on-accent)}
.chs-h{font-size:13px;font-weight:700;color:var(--ink2)}
.ch{background:var(--tint-c);border:1.5px solid var(--tint-c-line)}
.ch:hover{background:var(--accent-soft);border-color:var(--accent)}
.ch:disabled:hover{background:var(--tint-c);border-color:var(--tint-c-line)}
.chk{border:1px solid var(--seam);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--paper2)}
.chk-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.chk-h b{font-family:var(--f-voice);font-size:15px}
.chk-h span{font-size:12px;color:var(--ink2)}

    if(a<216&&gross<7000&&S.par.money<24000)add('자녀장려금',(gross<4000?100:100-50*(gross-4000)/3000)/12);

function speech(k){

  if(a<3)return pick(['응애…','(새근새근)','끙…','…음냐']);
  if(a<6)return pick(['아구~','꺄아!','우우…','에헤헤']);
  if(a<10)return pick(['마마마','바바바','아부부부','에에!']);
  if(a<15)return pick(['맘마!','이거!','까꿍!',p==='엄마'?'음마!':'압빠!']);
  if(a<24)return pick(['시여!','또 또!','이게 모야?','내 꺼!',p+' 안아']);
  if(a<36)return pick(['내가 할 거야!',p+' 조아','왜?','안 잘 거야!','같이 가!']);
  if(a<60)return pick([p+', 이건 왜 그래?','나 이제 다 컸어','같이 놀자!',p+'는 내 거야','나 이거 그렸어!']);
  if(a<108)return pick(['오늘 급식 맛있었어!',p+', 나 이거 봐 봐!','숙제 하기 싫어…','내 친구가 그러는데…','나 줄넘기 열 번 했어!']);
  if(a<156)return pick(lo?['몰라','알아서 할게','…']:['나도 폰 바꿔 줘','알아서 할게','오늘 체육 했어',p+' 요즘 잔소리 많아']);
  if(a<216)return pick(hi?[p+', 오늘 저녁 뭐야?','오늘 학교에서 웃긴 일 있었는데','나 좀 태워 줄 수 있어?']:lo?['ㅇㅇ','몰라','나가 줘','…']:['ㅇㅇ','졸려','용돈 좀','밥은 방에서 먹을게']);
  if(a<300)return pick(hi?['주말에 내려갈게요',p+' 반찬 좀 보내 줘요','오늘 좀 힘들었어요. 그냥 목소리 듣고 싶어서']:lo?['바빠요','나중에 전화할게요']:['이번 주말엔 못 가요','과제 폭탄…','잘 지내요']);
  return pick(hi?[p+', 건강검진 받았어요?','주말에 갈게요. 뭐 먹고 싶어요?','요즘 '+p+' 생각이 자주 나요']:lo?['잘 지내죠?','명절에 봬요']:['요즘 회사가 바빠요','잘 지내죠?','다음 달에 한번 갈게요']);
}

function notes(k){
  const n=[],a=k.age,T=TEMPS[k.temp],t1=TALENTS[k.tal[0]],t2=TALENTS[k.tal[1]],s=k.st;
  if(a>=4&&a<9)n.push(['기질',k.temp==='easy'?'잘 먹고 잘 자는 편입니다. 순한 아이인 것 같습니다.':k.temp==='hard'?'작은 자극에도 크게 웁니다. 예민한 편인 것 같습니다.':k.temp==='slow'?'낯선 것 앞에서 한참을 굳어 있습니다. 신중한 아이인 것 같습니다.':'어떤 날은 순하고 어떤 날은 예민합니다. 아직 잘 모르겠습니다.']);
  if(a>=9)n.push(['기질: '+T.n,T.d+' (토머스와 체스의 기질 연구: 순한 기질 40%, 까다로운 기질 10%, 더딘 기질 15%)']);
  if(a>=18&&a<48)n.push(['눈에 띄는 모습',t1.hint]);
  if(a>=48)n.push(['타고난 결: '+t1.n,'어릴 때부터 보이던 모습이 뚜렷해졌습니다. 이쪽 일을 할 때는 시간 가는 줄 모릅니다.']);
  if(a>=96)n.push(['또 하나의 결: '+t2.n,'자라면서 새로 드러난 모습입니다.']);
  if(k.late&&a>=18)n.push(['말',k.fl.caught?'말이 늦게 트였지만 지금은 또래와 다르지 않습니다.':'또래보다 말이 조금 늦습니다. 늦게 말하는 아이의 다수는 학교에 가기 전에 따라잡습니다.']);
  if(a>=84)n.push(['자기를 보는 눈',s.est>=60?'실패해도 "다시 하면 되지"라고 말합니다.':s.est<42?'"나는 원래 못해"라는 말을 자주 합니다.':'잘할 때는 으쓱하고 못할 때는 풀이 죽는, 그 나이다운 모습입니다.']);
  if(a>=120)n.push(['스스로 하는 힘',s.aut>=60?'시키지 않아도 자기 일을 챙깁니다.':s.aut<42?'무엇이든 먼저 물어보고 허락을 기다립니다.':'챙겨 주면 하고, 안 챙기면 잊습니다.']);
  if(a>=156)n.push(['버티는 힘',s.grit>=60?'하기로 한 일은 싫어도 끝을 봅니다.':s.grit<42?'어려워지면 금방 다른 것으로 옮겨 갑니다.':'좋아하는 일에는 끈질기고, 싫은 일에는 그렇지 않습니다.']);
  if(k.life&&k.life.major)n.push(['지금',lifeSummary(k)]);
  return n;
}

function vis(key){return key==='sta'?true:key==='money'||key==='retire'?S.unl.money:PKEYS.includes(key)?S.unl[key]:['est','aut','grit'].includes(key)?false:S.unl.dev}
function delta(key,v,k){
  if(!vis(key))return;
  const n=(k&&S.kids.length>1?k.name+' ':'')+statName(key,k),d=S.cur.delta,f=d.find(x=>x.n===n);
  if(f)f.v+=v;else d.push({n,v,m:key==='money'});
}
/* 내가 어떤 부모였는지 돌아볼 때 쓰는 기록: 따뜻함, 차가움, 맡김, 끌고 감, 단단함 */
function sty(e){
  if(!e)return;const y=S.sty;
  if(e.bond>0)y.warm+=e.bond;if(e.bond<0)y.cold-=e.bond;
  if(e.est>0)y.warm+=e.est*.5;if(e.est<0)y.cold-=e.est*.5;
  if(e.aut>0)y.free+=e.aut;if(e.aut<0)y.push-=e.aut;
  if(e.grit>0)y.firm+=e.grit;
}
function applyE(e,k,scale){
  if(!e)return;
  for(const key in e){
    let v=e[key];if(!v)continue;
    if(key==='money'){S.par.money+=v;delta(key,v)}
    else if(PKEYS.includes(key)){S.par[key]=clamp(S.par[key]+v);delta(key,v)}
    else if(k&&KKEYS.includes(key)){
      const cur=k.st[key],mind=S.par.mind;
      if(v>0&&scale)v*=scale;
      if(v>0&&k.tal.some(t=>TALENTS[t].st===key))v*=1.4;
      /* 내 마음이 넉넉하면 애착이 더 잘 쌓이고, 바닥이면 덜 쌓인다 */
      if(v>0&&(key==='bond'||key==='est'))v*=mind>=70?1.15:mind<35?.6:1;
      /* 높을수록 더 올리기 어렵고, 낮을수록 더 떨어지기 어렵다 */
      v=Math.round(v*(v>0?clamp((100-cur)/(key==='bond'?70:50),.12,1.25):clamp(cur/50,.3,1.3))*10)/10;
      k.st[key]=clamp(cur+v);delta(key,v,k);
      if(key==='bond'&&v>0)S.cur.bonded[k.id]=1;
    }
  }
}

function plant(k,sd,label,evt,kind){

}

function tickers(){const y=youngest();return activeKids().filter(k=>k===y||k.age-k.lastTick>=stepOf(k.lastTick))}

function startTurn(){

  statusTick();

    S.cur.lines[k.id]=k.age>=216?lifeYear(k).map(s=>fmt(s,k)):[fmt(STAGE[stageOf(k.age)][0],k)];

    const C=CHECKUPS.find(c=>!k.chkd[c.n]&&(c.a<60?k.age===c.a:k.age>=60&&k.age<72));
    if(C){k.chkd[C.n]=1;S.cur.chk[k.id]=makeCheckup(k,C)}

function statusTick(){

function arcsTick(tk){

  /* 확률로 생기는 순간은 조건이 맞는 첫 턴에 한 번만 기회가 온다 */
  const sure=el.find(m=>m.p==null),m=sure||el.find(m=>{if(R()<m.p)return true;k.miss[m.id]=1;return false});

const evW=(e,k)=>typeof e.w==='function'?e.w(k):e.w||1;
function buildQueue(tk){
  const q=[],y=youngest();

  due.slice(0,due.length>3?2:1).forEach(s=>q.push({echo:S.seeds.indexOf(s)}));
  S.cur.arcEnds.forEach(a=>q.push({arcEnd:a.id,kid:a.kid}));
  tk.forEach(k=>{
    const prim=k===y,step=stepOf(k.age),ok=e=>!k.ev[e.id]&&(!e.par||prim)&&(!e.cond||e.cond(k));
    let forced=EV.filter(e=>ok(e)&&(e.fix!=null?k.age>=e.fix&&k.age-e.fix<step:e.a==null&&!!e.cond));
    /* 둘째부터는 이미 겪어 본 영아기 사건의 절반쯤을 건너뛴다 */
    if(k.order>1)forced=forced.filter(e=>{if(e.fix==null||e.fix>=24||e.big||e.fix===3||R()<.45)return true;k.ev[e.id]=1;return false});

function lifeSummary(k){

function finishKid(k){

  k.end=endingOf(k);
  META.runs++;
  Object.keys(k.mo).forEach(id=>{META.seen[id]=1});
  META.gallery.unshift({name:k.name,sex:k.sex,look:k.look,title:k.end.title,job:(k.life&&k.life.job)||'',q:k.quilt.map(p=>({a:p.a,e:p.e,ph:p.ph&&p.ph.length?[1]:[]})),ax:k.end.ax,when:new Date().toISOString().slice(0,10)});
  META.gallery=META.gallery.slice(0,24);

}

  const lg=ledger(),p=S.par,row=x=>`<tr><td>${esc(x[0])}</td><td>${won(x[1])}</td></tr>`,i=tot(lg.inc),g=tot(lg.sup),e=tot(lg.exp);
  const paid=S.kids.filter(k=>!k.done&&k.age<72&&(k.fl.care==='daycare'||k.fl.care==='kinder')).map(k=>`${esc(k.name)}의 ${k.fl.care==='daycare'&&k.age<36?'어린이집 보육료 월 '+(k.age<12?'58만 4천원':k.age<24?'51만 5천원':'42만 6천원'):'유아 교육비 월 28만원'}은 정부가 기관에 직접 냅니다.`);
  openModal(`<div class="eyebrow">가계부 · 한 달 기준</div><h2>모은 돈 ${won(p.money)}</h2>
  <table class="ledger"><tbody><tr class="sec"><td colspan="2">들어오는 돈</td></tr>${lg.inc.map(row).join('')}
  ${lg.sup.length?'<tr class="sec"><td colspan="2">정부 지원</td></tr>'+lg.sup.map(row).join(''):''}<tr class="sumr"><td>들어오는 돈 합계</td><td>${won(i+g)}</td></tr>
  <tr class="sec"><td colspan="2">나가는 돈</td></tr>${lg.exp.map(row).join('')}<tr class="sumr"><td>나가는 돈 합계</td><td>${won(e)}</td></tr>
  <tr class="sumr"><td>한 달에 남는 돈</td><td style="color:var(--${lg.net>=0?'good':'bad'})">${lg.net>=0?'+':'−'}${won(Math.abs(lg.net))}</td></tr></tbody></table>
  ${paid.length?`<p class="small">${paid.join('<br>')}<br>가계부에는 잡히지 않는 지원입니다.</p>`:''}
  <p class="small">나: ${meLine(S.me)}<br>${spName()}: ${meLine(S.sp)}${p.retire?'<br>따로 모은 노후 자금: '+won(p.retire):''}</p>
  <p class="small">부부 생활비는 가계동향조사의 소득 수준별 소비지출에, 양육비는 보육실태조사에, 사교육비와 등록금, 정부 지원금은 2025~2026년 실제 금액에 맞췄습니다. 월급과 주거비는 단순화한 값입니다.</p>`);
}
function mSources(){openModal('<div class="eyebrow">자료 출처</div><h2>이 게임의 숫자들</h2><div class="src">'+SOURCES.map(s=>`<div><b>${s[0]}</b><span>${s[1]}</span></div>`).join('')+'</div>')}
function mHelp(){
  openModal(`<div class="eyebrow">도움말</div><h2>이렇게 흘러갑니다</h2><ul>
  <li>두 돌까지는 한 달, 다섯 살까지는 반 년, 그 뒤로는 한 해가 한 턴입니다. 아이가 서른다섯 살이 되면 끝납니다.</li>
  <li>턴마다 여력만큼 할 일을 고르고, 생긴 일에 답합니다. 정답은 없고, 고를 때마다 얻는 것과 내주는 것이 있습니다.</li>
  <li>여력은 기본 2칸입니다. 내가 일터에 나가지 않으면 +1, 배우자가 집에 있거나 부모님이 도와주시면 +1, 내 체력이 80 이상이면 +1입니다. 체력이 35 아래거나 마음이 30 아래면 한 칸씩 줄어듭니다. 1칸에서 4칸 사이입니다.</li>
  <li>열세 살부터는 아이가 스스로 정합니다. 부모는 지지하거나, 권하거나, 지켜봅니다.</li>
  <li>체력이나 돈이 바닥나도 끝나지 않습니다. 힘든 시기는 오지만 지나갑니다.</li>
  <li>화면의 숫자와 버튼에 마우스를 올리면(휴대폰에서는 누르면) 설명이 나옵니다.</li>
  <li>진행 상황은 턴마다 이 기기에 저절로 저장됩니다.</li></ul>
  <button class="gbtn" data-a="src">자료 출처 보기</button><button class="gbtn" data-a="home">처음 화면으로 (저장됨)</button>`);
}

/* 손잡이 */
const ACT={
  new(){if(loadSave()&&!UI.confirm&&!(S&&S.cur.phase==='end')){UI.confirm=true;UI.view='title';S=null;return render()}UI.confirm=false;S=null;UI.view='role';render(true)},
  cont(){const s=loadSave();if(s){S=migrate(s);UI.view=null;render(true)}},
  role(v){wipe();newGame(v);UI.view=null;save();render(true)},
  home(){$('#modal').hidden=true;UI.pop=false;UI.confirm=false;if(S&&S.cur.phase==='end')S=null;UI.view='title';render(true)},
  gallery(){UI.view='gallery';render(true)},
  baby(){addBaby();render(true)},
  name(v){$('#kidname').value=v;$('#nameerr').hidden=true},
  born(){const k=kidById(S.cur.kid),v=$('#kidname').value.trim();if(!v){$('#nameerr').hidden=false;$('#kidname').focus();return}k.name=v.slice(0,6);onBirth(k);render(true)},
  act(v){const i=S.acts.indexOf(v);if(i>=0)S.acts.splice(i,1);else if(S.acts.length<tokens())S.acts.push(v);save();render()},
  go(){applyActs();render(true)},
  pick(v){choose(+v);render(true)},
  next(){nextCard();render(true)},
  echo(){if(!S.cur.es){S.cur.es=1;save()}else resolveEcho();render(true)},
  pg(){S.cur.pg=(S.cur.pg||0)+1;save();render(true)},
  adv(){advance();render(true)},
  letterNext(){afterLetter();render(true)},
  focus(v){S.focus=+v;save();render()},
  quilt(v){mQuilt(v)},patch(v){mPatch(v)},seeds(){mSeeds()},notes(){mNotes()},ledger(){mLedger()},help(){mHelp()},src(){mSources()},
  close(){closeModal()}
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');
  if(b){if(b.disabled)return;hideTip();ACT[b.dataset.a](b.dataset.v);return}
  if(e.target.id==='modal'&&!UI.pop){closeModal();return}
  const t=e.target.closest('[data-tip]');
  if(t)showTip(t);else hideTip();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal();if(e.key==='Enter'&&e.target.id==='kidname')ACT.born()});
function showTip(t){
  const tip=$('#tip');tip.textContent=t.dataset.tip;tip.hidden=false;
  const r=t.getBoundingClientRect(),w=tip.offsetWidth,hh=tip.offsetHeight,vw=document.documentElement.clientWidth;
  let x=clamp(r.left+r.width/2-w/2,8,Math.max(8,vw-w-8)),y=r.bottom+8;
  if(y+hh>window.innerHeight-8)y=Math.max(8,r.top-hh-8);
  tip.style.left=x+'px';tip.style.top=y+'px';
}
function hideTip(){$('#tip').hidden=true}
document.addEventListener('mouseover',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(t)showTip(t)});
document.addEventListener('mouseout',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(t&&!t.contains(e.relatedTarget))hideTip()});
document.addEventListener('focusin',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');let fv=false;try{fv=t&&t.matches(':focus-visible')}catch(x){}if(fv)showTip(t)});
/* 터치 화면: 설명 풍선 밖을 누르면 닫는다 */
document.addEventListener('touchstart',e=>{if(!(e.target.closest&&e.target.closest('[data-tip]')))hideTip()},{passive:true});
document.addEventListener('focusout',hideTip);
window.addEventListener('scroll',hideTip,{passive:true});

/* 점검용: 콘솔에서 __auto()를 부르면 끝까지 아무 선택이나 하며 진행한다 */
function autoStep(){
  const c=S.cur;c.pops=[];
  switch(c.phase){
    case'family':addBaby();break;
    case'birth':{const k=kidById(c.kid);k.name=pick(NAMES[k.sex]);onBirth(k);break}
    case'intro':{const l=actList(),t=tokens();S.acts=[];let g=0;while(S.unl.acts&&S.acts.length<t&&g++<40){const a=pick(l).id;if(!S.acts.includes(a))S.acts.push(a)}applyActs();break}
    case'card':{const cd=cardOf(c.q[c.qi]);if(cd.kind==='echo')resolveEcho();else{const ok=cd.c.map((x,i)=>x.na?-1:i).filter(i=>i>=0);choose(pick(ok))}break}
    case'res':nextCard();break;
    case'wrap':advance();break;
    case'letter':afterLetter();break;
  }
}
window.__auto=n=>{let i=0;while(S&&S.cur.phase!=='end'&&i++<(n||9999))autoStep();if(typeof document!=='undefined'&&$('#app'))render();return S?S.cur.phase+' / '+S.turn+'턴':'없음'};

document.documentElement.lang='ko';
loadMeta();
render();
</script>
